[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lotr-sdk"
version = "1.0.0"
description = "Python SDK for The One API — Lord of the Rings"
requires-python = ">=3.10"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest", "pytest-mock", "pytest-cov"]

[tool.hatch.build.targets.wheel]
packages = ["src/lotr_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=lotr_sdk --cov-report=term-missing"

[tool.coverage.run]
source = ["lotr_sdk"]

[tool.coverage.report]
show_missing = true
